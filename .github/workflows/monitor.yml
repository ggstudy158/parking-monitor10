name: 停车账单监控 (湘ADG3397)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 运行监控检查
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
        run: |
          python3 parking_monitor.py --check
      - name: 保存状态与变更记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if [ -f changes.log ]; then git add changes.log; fi
          if git diff --cached --quiet; then
            echo "无状态变化，跳过提交"
          else
            git commit -m "chore: update parking snapshot [skip ci]"
            git push
          fi
